name: AQI Automated Pipelines

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  MONGO_URI: "mongodb+srv://root:root@cluster0.buofu8w.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0"
  MONGO_DB_NAME: "aqi_predictor"
  CITY_NAME: "Karachi"
  LATITUDE: "24.8607"
  LONGITUDE: "67.0011"

jobs:

  feature_and_backfill:
    name: "Fetch & Store Features"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Feature Pipeline
        run: python run_feature_pipeline.py

      - name: Run Backfill 7 days
        run: python backfill.py --days 7

      - name: Verify MongoDB data
        run: |
          python -c "
          from utils.db import load_features
          df = load_features('Karachi', limit=100)
          print(f'Total rows: {len(df)}')
          if len(df) > 0:
              print(f'Latest: {df[\"timestamp\"].max()}')
          "

  training_pipeline:
    name: "Train ML Models"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Training Pipeline
        run: python run_training_pipeline.py

      - name: Print model results
        run: |
          python -c "
          from utils.db import list_models
          for m in list_models():
              if m.get('metrics') and 'error' not in m['metrics'] and m['name'] != 'best_model':
                  print(f'{m[\"name\"]:15s} RMSE={m[\"metrics\"].get(\"RMSE\")} R2={m[\"metrics\"].get(\"R2\")}')
          "